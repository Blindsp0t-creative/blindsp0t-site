name: Instagram (publication hebdomadaire)

# NB : ajouter/modifier ce fichier via l'interface GitHub si le token local n'a pas
# le scope `workflow` (cf. claudeDOC/CONVENTIONS & HISTORY).

on:
  schedule:
    - cron: "0 8 * * 1"        # tous les lundis 08:00 UTC (~10h Paris été / 9h hiver)
  workflow_dispatch:            # bouton « Run workflow » pour tester manuellement

permissions:
  contents: write               # committer le déplacement queue/ -> published/

concurrency:
  group: instagram
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install requests pyyaml
      - name: Configure git author
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
      - name: Publish next queued post
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
        run: python tools/ig_publish.py
